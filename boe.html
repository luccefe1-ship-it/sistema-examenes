<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Oposición - Plataforma Exámenes</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/widgets.css">
    <link rel="stylesheet" href="css/boe.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <h1>🎯 Mi Oposición</h1>
            <div class="nav-actions">
                <span id="userName">Cargando...</span>
                <button id="backBtn" onclick="window.location.href='homepage.html'">← Volver</button>
            </div>
        </div>
    </nav>

    <div class="boe-container">

        <!-- ============ CUENTA ATRÁS ============ -->
        <section class="op-portada" id="opPortada">
            <div class="op-portada-izq">
                <span class="op-etiqueta" id="opCuerpo">—</span>
                <div class="op-dias"><span id="opDias">—</span><small>días para el examen</small></div>
                <p class="op-fecha" id="opFecha">—</p>
            </div>

            <!-- Los tres cuerpos de la misma convocatoria. Se puede
                 mirar cualquiera; el elegido se guarda en el perfil. -->
            <div class="op-selector">
                <label class="op-selector-titulo" for="selectorCuerpo">Ver información de</label>
                <select id="selectorCuerpo" class="op-selector-desplegable">
                    <option value="gestion">Gestión Procesal y Administrativa</option>
                    <option value="tramitacion">Tramitación Procesal y Administrativa</option>
                    <option value="auxilio">Auxilio Judicial</option>
                </select>
            </div>
        </section>

        <!-- ============ PESTAÑAS ============
             Tres, y cada una responde a una pregunta distinta:
               temario      -> ¿lo que estudio sigue siendo válido?
               convocatoria -> ¿cómo va el proceso?
               examen       -> ¿a qué me enfrento el día D?
             ================================================= -->
        <nav class="op-pestanas">
            <button class="op-pestana activa" data-panel="temario">
                <span class="op-pestana-icono">📚</span>
                <span class="op-pestana-texto">Mi temario</span>
            </button>
            <button class="op-pestana" data-panel="convocatoria">
                <span class="op-pestana-icono">📋</span>
                <span class="op-pestana-texto">Mi convocatoria</span>
            </button>
            <button class="op-pestana" data-panel="examen">
                <span class="op-pestana-icono">🗓️</span>
                <span class="op-pestana-texto">Mi examen</span>
            </button>
        </nav>

        <!-- ==========================================================
             LOS TRES PANELES, VACÍOS A PROPÓSITO.
             La estructura y el reparto están decididos; el contenido
             de cada uno se irá metiendo dentro de su <div>.
             ========================================================== -->

        <section class="op-panel activo" id="panel-temario">

            <!-- El temario OFICIAL del cuerpo elegido, tema a tema.
                 Nada de aquí sale de los temas subidos a la plataforma. -->
            <div class="op-bloque">
                <div class="op-bloque-cabecera">
                    <div>
                        <h3 class="op-titulo-seccion">Temario oficial</h3>
                        <p class="op-subtitulo" id="refTemario">—</p>
                    </div>
                    <span class="op-contador-normas" id="resumenTemas"></span>
                </div>

                <select id="selectorTema" class="op-tema-selector">
                    <option value="">Elige tema para revisar</option>
                </select>

                <div id="detalleTema" class="op-detalle"></div>
            </div>
        </section>

        <section class="op-panel" id="panel-convocatoria">
            <div id="contenidoConvocatoria"></div>
        </section>

        <section class="op-panel" id="panel-examen">
            <div id="contenidoExamen"></div>
        </section>
    </div>

    <script>
    /* Fondo según la hora, igual que el resto de la plataforma.
       Se hace antes de cargar los datos para que no parpadee de claro
       a oscuro al entrar de noche. */
    function actualizarFondoHora() {
        const hora = new Date().getHours();
        const body = document.body;

        body.classList.remove('dia', 'tarde', 'noche');

        if (hora >= 6 && hora < 18) body.classList.add('dia');
        else if (hora >= 18 && hora < 21) body.classList.add('tarde');
        else body.classList.add('noche');
    }

    actualizarFondoHora();
    document.addEventListener('DOMContentLoaded', actualizarFondoHora);
    setInterval(actualizarFondoHora, 60000 * 10);
    </script>

    <script type="module" src="js/boe.js"></script>

<!-- Asistente flotante, se inyecta solo -->
<script type="module" src="js/asistente-widget.js"></script>

</body>
</html>
